<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Тестовая тема форума</title>
</head>
<body>
    <h1>Тестовая тема форума</h1>

    <div class="post" data-id="101">
        <span class="username">alice</span>
        <div class="message">Привет, <b>мир</b>!</div>
    </div>

    <div class="post" id="post-102">
        <span class="username">bob</span>
        <div class="message"><p>Второе сообщение</p></div>
    </div>

    <div class="post" data-comment-id="103">
        <span class="username">alice</span>
        <div class="message">Третье и последнее</div>
    </div>

    <div class="post">
        <span class="username">no-id</span>
        <div class="message">Сообщение без ID должно быть пропущено</div>
    </div>
</body>
</html>
